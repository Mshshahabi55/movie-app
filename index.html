<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reelio · movie finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <div class="container">
      <div class="header-row">
        <h1 class="header-logo">🎞️ reelio</h1>
        <div class="header-tools">
          <button class="icon-btn" id="themeBtn">
            <span class="theme-icon-light">☀️</span>
            <span class="theme-icon-dark">🌙</span>
          </button>
          <button class="icon-btn" id="favsBtn">
            <span>❤️</span>
            <span class="badge" id="favBadge">0</span>
          </button>
        </div>
      </div>
      <div class="search">
        <input type="text" id="searchInput" placeholder="search movies..." class="search-field">
        <button id="searchBtn" class="search-btn">🔍</button>
      </div>
      <div class="filters">
        <button class="filter filter-active" data-type="popular">🔥 Popular</button>
        <button class="filter" data-type="now_playing">🎬 Now playing</button>
        <button class="filter" data-type="top_rated">⭐ Top rated</button>
        <button class="filter" data-type="upcoming">📅 Upcoming</button>
        <button class="filter" data-type="favorites">❤️ Favorites</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div id="grid" class="grid"></div>
      <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p>loading more...</p>
      </div>
      <div id="end" class="end-message hidden">
        <p>no more movies ✌️</p>
      </div>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-inner" id="modalBody"></div>
  </div>

  <div id="sidebar" class="sidebar hidden">
    <div class="sidebar-head">
      <h2>❤️ your list</h2>
      <button id="closeSidebar" class="close">&times;</button>
    </div>
    <div id="favList" class="sidebar-list"></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
